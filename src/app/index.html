<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'" />
  <title>AnimationVsAnimator</title>
  <style>
    html, body { margin: 0; height: 100%; overflow: hidden; background: transparent; user-select: none; }
    canvas { display: block; width: 100vw; height: 100vh; }
    /* Preview mode (plain browser): fake a desktop so you can see him. */
    body.preview { background: linear-gradient(160deg, #2c3e50, #4a6278); }
    body.preview .hint { position: fixed; top: 10px; left: 12px; color: #fffa; font: 13px system-ui, sans-serif; }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>
  <script src="renderer.js"></script>
</body>
</html>
